<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Link WhatsApp — ACADEX</title>
  <style>
    :root {
      --g: #0a7a3c;
      --g-hover: #086330;
      --g-light: #ecfdf5;
      --ink: #0f172a;
      --muted: #64748b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --amber: #f59e0b;
      --amber-light: #fffbeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--g-light);
      color: var(--g);
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
      border: 1px solid #bbf7d0;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--amber-light);
      color: #b45309;
      border: 1px solid #fde68a;
      text-transform: uppercase;
    }
    .status-badge.on {
      background: var(--g-light);
      color: var(--g);
      border-color: #bbf7d0;
    }
    .code-label {
      margin: 14px 0 6px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .code-box {
      font-size: 44px;
      letter-spacing: 6px;
      font-weight: 900;
      text-align: center;
      color: var(--g);
      margin: 6px 0 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #f1f5f9;
      padding: 14px 10px;
      border-radius: 14px;
      border: 2px dashed #cbd5e1;
    }
    .btn-copy {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--g);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .btn-copy:hover {
      background: var(--g-hover);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider:not(:empty)::before {
      margin-right: .75em;
    }
    .divider:not(:empty)::after {
      margin-left: .75em;
    }
    .qr-wrap {
      text-align: center;
      padding: 16px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .qr-wrap img {
      width: 250px;
      height: 250px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .qr-caption {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 10px;
    }
    ol {
      margin: 12px 0 0;
      padding-left: 20px;
    }
    li {
      margin-bottom: 10px;
      font-size: 14px;
    }
    .hint-box {
      background: #f8fafc;
      border-left: 3px solid var(--g);
      padding: 12px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #334155;
      margin-top: 14px;
      line-height: 1.6;
    }
    .live-card {
      background: var(--g-light);
      border: 1px solid #bbf7d0;
      text-align: center;
      padding: 32px 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo-badge">🎓 ACADEX WhatsApp Companion</div>
      <h1>Link ACADEX to WhatsApp</h1>
      <p class="sub">Pair phone <b>+263 71 698 7183</b> using either the <b>Pairing Code</b> or the <b>QR Code</b>.</p>
    </div>

    <div id="portalContent">
      <div class="card" style="text-align:center;padding:36px;">
        <p style="color:var(--muted);font-weight:600;">Loading Pairing Code & QR Code...</p>
      </div>
    </div>
  </div>

  <script>
    let currentCode = '';

    async function updateStatus() {
      try {
        const res = await fetch('/api/link-status?t=' + Date.now());
        const data = await res.json();
        const root = document.getElementById('portalContent');

        if (data.connected || data.status === 'connected') {
          root.innerHTML = `
            <div class="card live-card">
              <span class="status-badge on">● LIVE CONNECTED</span>
              <h2 style="margin:14px 0 6px;color:#065f46;">Auto-Replies Are Active!</h2>
              <p style="color:#047857;margin:0 0 16px;font-size:14px;">WhatsApp bot is successfully linked to <b>+263 71 698 7183</b>.</p>
              <div style="background:#fff;padding:16px;border-radius:12px;border:1px solid #a7f3d0;font-size:14px;line-height:1.6;color:#1e293b;">
                Students can message <b>"hi"</b> or send any question for instant step-by-step marking and past paper downloads.
              </div>
            </div>
          `;
          return;
        }

        currentCode = data.pairingCode || '9764-Z2RS';
        const rawCode = currentCode.replace(/-/g, '');
        const qrImage = data.qrDataUrl ? `
          <div class="qr-wrap">
            <img src="${data.qrDataUrl}" alt="WhatsApp QR Code">
            <div class="qr-caption">📷 Scan with WhatsApp Camera (Option 2)</div>
          </div>
        ` : '';

        root.innerHTML = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-weight:800;font-size:15px;color:var(--g);">OPTION 1: 8-DIGIT PAIRING CODE</span>
              <span class="status-badge">READY</span>
            </div>
            
            <div class="code-label">Enter this code on your WhatsApp phone:</div>
            <div class="code-box">${currentCode}</div>
            
            <button class="btn-copy" onclick="copyCode(this, '${rawCode}')">
              <span>📋 Copy 8-Digit Code</span>
            </button>

            <div class="divider">OR SCAN QR CODE</div>

            ${qrImage}
          </div>

          <div class="card">
            <h3 style="margin:0 0 8px;font-size:16px;">📲 Instructions for Linking:</h3>
            <ol>
              <li>Open <b>WhatsApp</b> on your phone (<code>+263 71 698 7183</code>).</li>
              <li>Tap <b>⋮ (3 dots)</b> at the top right (or <b>Settings</b> on iPhone).</li>
              <li>Tap <b>Linked Devices</b> $\\rightarrow$ <b>Link a Device</b>.</li>
              <li><b>To enter code:</b> Tap <i>"Link with phone number instead"</i> and type <b style="color:var(--g);">${currentCode}</b>.</li>
              <li><b>To scan QR:</b> Simply point your phone's camera at the QR code above.</li>
            </ol>
            <div class="hint-box">
              🇿🇼 <b>ChiShona:</b> Vhura WhatsApp $\\rightarrow$ Linked devices $\\rightarrow$ Link a device $\\rightarrow$ Nyora code iri pamusoro kana kutarisa QR code nekhamera.
            </div>
          </div>
        `;
      } catch (e) {
        console.warn('Status fetch error:', e);
      }
    }

    function copyCode(btn, code) {
      navigator.clipboard.writeText(code).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<span>✅ Copied to Clipboard!</span>';
        btn.style.background = '#065f46';
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.style.background = '';
        }, 2000);
      });
    }

    updateStatus();
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>
